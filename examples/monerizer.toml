schema_version = 1

[services]
p2pool = "monerizer-p2pool.service"
xmrig = "monerizer-xmrig.service"

[p2pool]
data_api_dir = "/run/monerizer-p2pool-api"
# params_file = "/etc/monerizer/p2pool.conf"   # нужен командам node и проверке NODE_RPC
# nodes_file = "/etc/monerizer/nodes.txt"      # нужен командам node

[xmrig]
api_url = "http://127.0.0.1:18088"
expected_id = "monerizer-xmrig"
# token_file = "/etc/monerizer/xmrig-api.token"   # только если http.access-token задан в xmrig.json

[ui]
refresh_ms = 1000
