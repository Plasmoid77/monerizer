# P2Pool params-file для moneroid-p2pool.service.
# Формат: key = value, boolean как 1. Справочник: p2pool --help / docs/COMMAND_LINE.MD.
# Замените wallet и host/порты ноды перед запуском.

wallet = YOUR_PRIMARY_ADDRESS_STARTING_WITH_4
host = 127.0.0.1
rpc-port = 18081
zmq-port = 18083

# Sidechain: mini = 1 или nano = 1; уберите обе строки для main.
mini = 1

stratum = 127.0.0.1:3333
data-dir = /var/lib/moneroid/p2pool
data-api = /run/moneroid-p2pool-api
local-api = 1
no-upnp = 1
no-color = 1
no-log-file = 1
loglevel = 3

# Без собственного RandomX dataset (-2 GB RAM); hugepages достаются XMRig.
# Проверка shares медленнее, для одиночного майнера незаметно.
light-mode = 1
