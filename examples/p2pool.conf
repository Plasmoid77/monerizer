# P2Pool params-file for moneroid-p2pool.service.
# Format: key = value, booleans as 1. Reference: p2pool --help / docs/COMMAND_LINE.MD.
# Replace wallet and the node host/ports before starting.

wallet = YOUR_PRIMARY_ADDRESS_STARTING_WITH_4
host = 127.0.0.1
rpc-port = 18081
zmq-port = 18083

# Sidechain: mini = 1 or nano = 1; remove both lines for main.
mini = 1

stratum = 127.0.0.1:3333
data-dir = /var/lib/moneroid/p2pool
data-api = /run/moneroid-p2pool-api
local-api = 1
no-upnp = 1
no-color = 1
no-log-file = 1
loglevel = 3

# No RandomX dataset of its own (-2 GB RAM); the hugepages go to XMRig.
# Share verification is slower, unnoticeable for a single miner.
light-mode = 1
